# Scenario: Pine Sawdust High-Yield Bio-Oil Fast Pyrolysis
scenario_name: "Pine Sawdust Fast Pyrolysis"

feedstock:
  name: "pine_sawdust"
  feed_rate_kg_h: 250.0
  moisture_pct: 12.0
  particle_size_mm: 1.5

drying:
  target_moisture_pct: 5.0
  dryer_temperature_c: 105.0

reactor:
  temperature_c: 520.0
  heating_rate_c_min: 600.0  # High heating rate
  residence_time_min: 0.1     # Short vapor residence time
